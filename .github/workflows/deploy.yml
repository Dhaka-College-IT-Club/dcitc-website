name: Deploy frontend (production)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Link and pull project settings
        run: |
          mkdir -p .vercel
          printf '{"projectId": "%s", "orgId": "%s"}\n' "${{ secrets.VERCEL_PROJECT_ID }}" "${{ secrets.VERCEL_ORG_ID }}" > .vercel/project.json
          npx vercel pull --yes --environment=production --token "${{ secrets.VERCEL_TOKEN }}"
      - name: Build prebuilt output
        run: npx vercel build --prod --token "${{ secrets.VERCEL_TOKEN }}"
      - name: Deploy to Vercel (production)
        run: npx vercel deploy --prebuilt --prod --yes --token "${{ secrets.VERCEL_TOKEN }}" 2>&1 | tee deploy-url.log
